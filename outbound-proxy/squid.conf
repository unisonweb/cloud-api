# Destination IP is in the local (VPC) network
acl localnet_dst dst 0.0.0.1-0.255.255.255	# RFC 1122 "this" network (LAN)
acl localnet_dst dst 10.0.0.0/8		# RFC 1918 local private network (LAN)
acl localnet_dst dst 100.64.0.0/10		# RFC 6598 shared address space (CGN)
acl localnet_dst dst 169.254.0.0/16 	# RFC 3927 link-local (directly plugged) machines
acl localnet_dst dst 172.16.0.0/12		# RFC 1918 local private network (LAN)
acl localnet_dst dst 192.168.0.0/16		# RFC 1918 local private network (LAN)
acl localnet_dst dst fc00::/7       	# RFC 4193 local private network range
acl localnet_dst dst fe80::/10      	# RFC 4291 link-local (directly plugged) machines

acl SSL_ports port 443
acl Safe_ports port 80		# http
acl Safe_ports port 21		# ftp
acl Safe_ports port 443		# https
acl Safe_ports port 70		# gopher
acl Safe_ports port 210		# wais
acl Safe_ports port 1025-65535	# unregistered ports
acl Safe_ports port 280		# http-mgmt
acl Safe_ports port 488		# gss-http
acl Safe_ports port 591		# filemaker
acl Safe_ports port 777		# multiling http
acl CONNECT method CONNECT


acl staging_unison_cloud_user_services dstdomain -n .services.staging.unison.cloud

# NOTE: it's important to not add anything to here that might be dangerous in the real world
acl integration-test-hosts dstdomain -n byoc-0000 byoc-0001 nimbus-0000 unison-cloud-services.unison-test-s3 unison-cloud-user-blobs.unison-test-s3 unison-test-dynamo

acl dynamodb_gateway dstdomain -n dynamodb.us-west-2.amazonaws.com
acl s3_gateway dstdomain -n s3.us-west-2.amazonaws.com .s3.amazonaws.com

# Destination domains that we explicitly deny
acl domain_deny_list dstdomain -n "/etc/squid/overrides/domain-deny-list.txt"

################################################################################

include /etc/squid/overrides/*.conf

################################################################################


http_access deny domain_deny_list

#
# Recommended minimum Access Permission configuration:
#
# Deny requests to certain unsafe ports
http_access deny !Safe_ports

http_access allow integration-test-hosts

# Deny CONNECT to other than secure SSL ports
http_access deny CONNECT !SSL_ports

# Only allow cachemgr access from localhost
http_access allow localhost manager
http_access deny manager

# We strongly recommend the following be uncommented to protect innocent
# web applications running on the proxy server who think the only
# one who can access services on "localhost" is a local user
http_access deny to_localhost

# User services in staging have a private IP address, but we are fine with people calling them
http_access allow staging_unison_cloud_user_services SSL_ports

# VPC gateways
http_access allow SSL_ports dynamodb_gateway
http_access allow SSL_ports s3_gateway

# deny access to local (VPC) network
http_access deny localnet_dst

http_upgrade_request_protocols websocket allow all
http_upgrade_request_protocols WebSocket allow all

# Squid normally listens to port 3128
http_port 3128


max_filedescriptors 1024
